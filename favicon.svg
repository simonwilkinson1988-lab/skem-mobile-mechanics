<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" rx="80" fill="#0D0D0F"/>
    <!-- Crossed wrenches simplified -->
    <g transform="translate(256,256)">
      <!-- Left wrench -->
      <g transform="rotate(-45)">
        <rect x="-20" y="-180" width="40" height="360" rx="20" fill="#E30613"/>
        <circle cx="0" cy="-160" r="50" fill="none" stroke="#E30613" stroke-width="20"/>
        <rect x="-12" y="100" width="24" height="80" rx="8" fill="#E30613"/>
      </g>
      <!-- Right wrench -->
      <g transform="rotate(45)">
        <rect x="-20" y="-180" width="40" height="360" rx="20" fill="#E30613"/>
        <circle cx="0" cy="-160" r="50" fill="none" stroke="#E30613" stroke-width="20"/>
        <rect x="-12" y="100" width="24" height="80" rx="8" fill="#E30613"/>
      </g>
      <!-- Centre circle (turbo) -->
      <circle cx="0" cy="0" r="80" fill="#0D0D0F" stroke="#E30613" stroke-width="16"/>
      <circle cx="0" cy="0" r="45" fill="#E30613"/>
      <circle cx="0" cy="0" r="20" fill="#0D0D0F"/>
    </g>
  </svg>